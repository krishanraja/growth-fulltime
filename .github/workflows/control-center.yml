# The Control Center growth engine loop on a clean runner (docs/CONTROL-CENTER-BRIEF.md).
#
# Control Center wakes this repository every morning around 06:10 London with
# a repository_dispatch of type cc-growth-directive, whose payload carries only
# { directive_id, engine_id }. The loop journals a started attempt, pulls the
# directive, runs the self-test and repository verification, reads the public
# sources the hourly sync reads, reports with a digest readback, reads Krish's
# decisions and journals the end. It never sends, posts, spends or publishes,
# and it uploads nothing: private history lives only in the persistent
# workspace, so the objectives measured there report as missing here.
#
# Google Analytics (docs/GA4-ACCESS.md, route A): when the repository variables
# GA4_WIF_PROVIDER, GA4_SERVICE_ACCOUNT and GA4_PROPERTY_ID are set, the job swaps
# GitHub's own identity for a ten-minute, read-only Google token (keyless: no key,
# secret or refresh token exists anywhere) and reads aggregate landings into the
# runner's local/ folder. Google accepts that identity only from this repository's
# main branch. The export is never uploaded, and a GA4 failure never stops the loop.
name: control center loop
on:
  repository_dispatch:
    types: [cc-growth-directive]
  workflow_dispatch:
    inputs:
      synthetic:
        description: 'Report in synthetic mode (stored and read back, never counted)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: control-center-loop
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # only to request GitHub's identity token for the keyless Google sign-in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Keyless, read-only Google sign-in for Analytics
        id: google
        if: vars.GA4_SERVICE_ACCOUNT != '' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GA4_WIF_PROVIDER }}
          service_account: ${{ vars.GA4_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Read Google Analytics landings (aggregate, kept on the runner)
        # This repository is public, so its run logs are too: print only whether the
        # read worked and its error code, never a count.
        if: steps.google.outputs.access_token != ''
        continue-on-error: true
        env:
          GA4_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: |
          mkdir -p local/ga4
          status=0
          python3 growth.py ga4 report --days 7 --out local/ga4/landings-latest.json > local/ga4/last-report.json || status=$?
          python3 -c "import json; r = json.load(open('local/ga4/last-report.json', encoding='utf-8')); print('Google Analytics read:', r.get('status'), r.get('error_code') or '')"
          exit $status
      - name: Run the protocol loop
        env:
          CONTROL_CENTER_ENGINE_TOKEN: ${{ secrets.CONTROL_CENTER_ENGINE_TOKEN }}
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CC_DIRECTIVE_ID: ${{ github.event.client_payload.directive_id }}
          CC_DISPATCH_ENGINE_ID: ${{ github.event.client_payload.engine_id }}
          CC_SYNTHETIC: ${{ inputs.synthetic && '1' || '' }}
        run: |
          if [ -n "$CC_SYNTHETIC" ]; then
            python3 growth.py cc dispatch --synthetic
          else
            python3 growth.py cc dispatch
          fi
