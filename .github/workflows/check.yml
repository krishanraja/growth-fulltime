name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 growth.py --self-test
      - name: Ensure local renderer tools are available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/verify_repository.py
      - run: python3 -c "import json; json.load(open('automations.json')); json.load(open('rulings.json'))"
